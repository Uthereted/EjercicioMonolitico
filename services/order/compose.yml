name: order-service

services:

  order-service:

    build:
      context: ../..
      dockerfile: services/order/Dockerfile

    ports:
      - "13001:8000"

    volumes:
      - "./db_volume:/volume"

    environment:
      PYTHONUNBUFFERED: 1
      SQLALCHEMY_DATABASE_URL: sqlite+aiosqlite:////volume/orders.db
      ORDER_SERVICE_AUTH_SECRET: ${ORDER_SERVICE_AUTH_SECRET:-development-order-service-secret-change-me}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://manufacturing:manufacturing@host.docker.internal:5672/}
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE:-manufacturing.events}

    restart: on-failure
