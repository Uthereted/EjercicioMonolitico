name: order-service

services:

  order-service:

    build:
      context: ../..
      dockerfile: services/order/Dockerfile

    ports:
      - "13001:8000"

    volumes:
      - "./data:/volume"

    environment:
      PYTHONUNBUFFERED: 1
      SQLALCHEMY_DATABASE_URL: sqlite+aiosqlite:////volume/orders.db
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://manufacturing:manufacturing@host.docker.internal:5672/}
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE:-manufacturing.events}
      LOG_AGGREGATOR_URL: ${LOG_AGGREGATOR_URL:-http://host.docker.internal:13007}
      MONGODB_URL: ${MONGODB_URL:-mongodb://host.docker.internal:27017}
      AUDIT_DATABASE: manufacturing_audit

    restart: on-failure
