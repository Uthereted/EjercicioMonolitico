[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "manufacturing-chassis"
version = "0.1.0"
description = "Logs y health check compartidos para microservicios FastAPI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["fastapi~=0.114"]

[project.optional-dependencies]
test = ["httpx~=0.28"]

[tool.setuptools.packages.find]
include = ["manufacturing_chassis*"]
