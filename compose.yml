services:
  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    environment:
      RABBITMQ_CONFIG_FILES: /etc/rabbitmq/conf.d
      RABBITMQ_DEFAULT_USER: manufacturing
      RABBITMQ_DEFAULT_PASS: manufacturing
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./infrastructure/rabbitmq/20-domain.conf:/etc/rabbitmq/conf.d/20-domain.conf:ro
      - ./infrastructure/rabbitmq/domain-definitions.json:/etc/rabbitmq/domain-definitions.json:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: on-failure

  order-service:
    depends_on:
      rabbitmq:
        condition: service_healthy
    build:
      context: .
      dockerfile: services/order/Dockerfile
    ports:
        - "13001:8000"
    volumes:
        - "./services/order/db_volume:/volume"
    environment:
        PYTHONUNBUFFERED: 1
        SQLALCHEMY_DATABASE_URL: sqlite+aiosqlite:////volume/orders.db
        ORDER_SERVICE_AUTH_SECRET: ${ORDER_SERVICE_AUTH_SECRET:-development-order-service-secret-change-me}
        RABBITMQ_URL: amqp://manufacturing:manufacturing@rabbitmq:5672/
        RABBITMQ_EXCHANGE: manufacturing.events
    restart: on-failure

  delivery:
    depends_on:
      rabbitmq:
        condition: service_healthy
    build:
      context: .
      dockerfile: services/delivery/Dockerfile
    ports:
      - '13004:8000'
    volumes:
      - '.services/delivery/delivery_volume:/volume'
    environment:
      PYTHONUNBUFFERED: 1
      SQLALCHEMY_DATABASE_URL: ${DELIVERY_DATABASE_URL}
      RABBITMQ_URL: amqp://manufacturing:manufacturing@rabbitmq:5672/
      RABBITMQ_EXCHANGE: manufacturing.events
    restart: on-failure

  machineservice:
    depends_on:
      rabbitmq:
        condition: service_healthy
    build:
      context: .
      dockerfile: services/machine/Dockerfile
    ports:
      - '13002:8000'
    volumes:
      - machine_data:/volume
    environment:
      PYTHONUNBUFFERED: 1
      SQLALCHEMY_DATABASE_URL: sqlite+aiosqlite:////volume/machine.db
      RABBITMQ_URL: amqp://manufacturing:manufacturing@rabbitmq:5672/
      RABBITMQ_EXCHANGE: manufacturing.events
    restart: on-failure

  client_service:
    depends_on:
      rabbitmq:
        condition: service_healthy
    build:
      context: .
      dockerfile: services/client/Dockerfile
    container_name: client_service
    ports:
      - '13005:8000'
    volumes:
      - '.services/client/db_volume:/volume'
    environment:
      - PYTHONUNBUFFERED=1
      - ORDER_SERVICE_AUTH_SECRET=${ORDER_SERVICE_AUTH_SECRET:-development-order-service-secret-change-me}
      - PAYMENT_SERVICE_AUTH_SECRET=${PAYMENT_SERVICE_AUTH_SECRET:-development-payment-service-secret-change-me}
      - SQLALCHEMY_DATABASE_URL=sqlite+aiosqlite:////volume/client.db
      - RABBITMQ_URL=amqp://manufacturing:manufacturing@rabbitmq:5672/
      - RABBITMQ_EXCHANGE=manufacturing.events
    restart: on-failure

  paymentservice:
    depends_on:
      rabbitmq:
        condition: service_healthy
    build:
      context: .
      dockerfile: services/payment/Dockerfile
    ports:
      - '13006:8000'
    volumes:
      - '.services/payment/payment_db_volume:/volume'
    environment:
      PYTHONUNBUFFERED: 1
      SQLALCHEMY_DATABASE_URL: sqlite+aiosqlite:////volume/payment.db
      PAYMENT_SERVICE_AUTH_SECRET: ${PAYMENT_SERVICE_AUTH_SECRET:-development-payment-service-secret-change-me}
      RABBITMQ_URL: amqp://manufacturing:manufacturing@rabbitmq:5672/
      RABBITMQ_EXCHANGE: manufacturing.events
    restart: on-failure

  mongodb:
    image: mongo:8.0
    volumes:
      - audit_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ping:1})"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: on-failure

  event-logger:
    build:
      context: .
      dockerfile: services/event_logger/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    environment:
      PYTHONUNBUFFERED: 1
      MONGODB_URL: mongodb://mongodb:27017
      AUDIT_DATABASE: manufacturing_audit
      RABBITMQ_URL: amqp://manufacturing:manufacturing@rabbitmq:5672/
      RABBITMQ_EXCHANGE: manufacturing.events
    restart: on-failure

  haproxy:
    image: haproxy:latest
    ports:
      - "8080:8080"
      - "8443:8443" # <-- AÃ±ades el puerto HTTPS
      - "8404:8404"
    volumes:
      - "./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro"
      - "./haproxy/gateway.pem:/usr/local/etc/haproxy/haproxy.pem:ro" # <-- Montas tu certificado
    environment:
      HAPROXY_PORT: 8080
      HAPROXY_STATS_PORT: 8404
    depends_on:
      - order-service
      - delivery
      - client_service
      - paymentservice
      - machineservice
    restart: on-failure

volumes:
  rabbitmq_data:
  machine_data:
  audit_data:
