services:
  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: manufacturing
      RABBITMQ_DEFAULT_PASS: manufacturing
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: on-failure

  order-service:
    depends_on:
      rabbitmq:
        condition: service_healthy
    build: services/order
    ports:
        - "13001:8000"
    volumes:
        - "./services/order/db_volume:/volume"
    environment:
        PYTHONUNBUFFERED: 1
        SQLALCHEMY_DATABASE_URL: sqlite+aiosqlite:////volume/orders.db
        CLIENT_SERVICE_URL: http://client_service:8000
        RABBITMQ_URL: amqp://manufacturing:manufacturing@rabbitmq:5672/
        RABBITMQ_EXCHANGE: manufacturing.events
        MACHINE_SERVICE_URL: http://machineservice:8000
        DELIVERY_SERVICE_URL: http://delivery:8000
    restart: on-failure

  delivery:
    build: services/delivery
    ports:
      - '13004:8000'
    volumes:
      - './delivery_volume:/volume'
    environment:
      PYTHONUNBUFFERED: 1
      SQLALCHEMY_DATABASE_URL: ${DELIVERY_DATABASE_URL}
      ORDERS_SERVICE_URL: http://order-service:8000
    restart: on-failure

  machineservice:
    build: services/machine
    ports:
      - '13002:8000'
    environment:
      PYTHONUNBUFFERED: 1
      ORDERS_SERVICE_URL: http://order-service:8000
    restart: on-failure

  client_service:
    build: services/client
    container_name: client_service
    ports:
      - '13005:8000'
    volumes:
      - './db_volume:/volume'
    environment:
      - PYTHONUNBUFFERED=1
      - SQLALCHEMY_DATABASE_URL=sqlite+aiosqlite:////volume/client.db
    restart: on-failure

  paymentservice:
    depends_on:
      rabbitmq:
        condition: service_healthy
    build:
      context: services/payment
      dockerfile: Dockerfile
    ports:
      - '13006:8000'
    volumes:
      - './payment_db_volume:/volume'
    environment:
      PYTHONUNBUFFERED: 1
      SQLALCHEMY_DATABASE_URL: sqlite+aiosqlite:////volume/payment.db
      CLIENT_SERVICE_URL: http://client_service:8000
      ORDERS_SERVICE_URL: http://order-service:8000
      RABBITMQ_URL: amqp://manufacturing:manufacturing@rabbitmq:5672/
      RABBITMQ_EXCHANGE: manufacturing.events
    restart: on-failure

  haproxy:
    image: haproxy:latest
    ports:
      - "8080:8080"
      - "8404:8404"
    volumes:
      - "./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro"
    environment:
      HAPROXY_PORT: 8080
      HAPROXY_STATS_PORT: 8404
    depends_on:
      - order-service
      - delivery
      - client_service
      - paymentservice
      - machineservice
    restart: on-failure

volumes:
  rabbitmq_data:
