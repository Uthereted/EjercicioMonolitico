services:
  monolithicapp:
    build: fastapi_app
    ports:
      - '13000:8000'
      - '13443:8443'
    volumes:
      #- './fastapi_app:/home/pyuser/code'
      - './db_volume:/volume'
    environment:
      PYTHONUNBUFFERED: 1
      SQLALCHEMY_DATABASE_URL: ${SQLALCHEMY_SQLITE_DATABASE_URI}
    restart: on-failure

  paymentservice:
    build:
      context: fastapi_app
      dockerfile: Dockerfile
    ports:
      - '13002:8000'
    volumes:
      - './payment_db_volume:/volume'
    environment:
      PYTHONUNBUFFERED: 1
      SQLALCHEMY_DATABASE_URL: sqlite+aiosqlite:////volume/payment.db
      CLIENT_SERVICE_URL: http://clientservice:8000
    restart: on-failure