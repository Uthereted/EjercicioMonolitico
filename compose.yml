services:
  monolithicapp:
    build: fastapi_app
    ports:
      - '13000:8000'
      - '13443:8443'
    volumes:
      - './db_volume:/volume'
    environment:
      PYTHONUNBUFFERED: 1
      SQLALCHEMY_DATABASE_URL: ${MONOLITHIC_DATABASE_URL}
    restart: on-failure

  delivery:
    build: services/delivery/delivery_app
    ports:
      - '13004:8000'
    volumes:
      - './delivery_volume:/volume'
    environment:
      PYTHONUNBUFFERED: 1
      SQLALCHEMY_DATABASE_URL: ${DELIVERY_DATABASE_URL}
    restart: on-failure