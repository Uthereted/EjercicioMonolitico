x-tls-environment: &tls-environment
  SSL_CERT_FILE: /tls/ca.crt
  TLS_CA_FILE: /tls/ca.crt
  TLS_CERT_FILE: /tls/server.crt
  TLS_KEY_FILE: /tls/server.key
  API_SCHEME: https

services:
  consul:
    image: hashicorp/consul:1.21.3
    command: ["agent", "-dev", "-client=0.0.0.0", "-bind=127.0.0.1", "-config-file=/consul/config/tls.json"]
    ports:
      - "127.0.0.1:8500:8501"
    volumes:
      - ./infrastructure/consul/tls.json:/consul/config/tls.json:ro
      - ./infrastructure/tls/generated:/tls:ro
    environment:
      CONSUL_HTTP_ADDR: https://127.0.0.1:8501
      CONSUL_CACERT: /tls/ca.crt
    healthcheck:
      test: ["CMD", "consul", "info"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: on-failure

  rabbitmq:
    image: rabbitmq:4-management
    hostname: ${RABBITMQ_HOSTNAME:-rabbitmq}
    ports:
      - "127.0.0.1:5671:5671"
      - "127.0.0.1:15672:15671"
    environment:
      RABBITMQ_CONFIG_FILES: /etc/rabbitmq/conf.d
      RABBITMQ_DEFAULT_USER: manufacturing
      RABBITMQ_DEFAULT_PASS: manufacturing
    volumes:
      - ./infrastructure/tls/generated:/tls:ro
      - ./infrastructure/rabbitmq/30-tls.conf:/etc/rabbitmq/conf.d/30-tls.conf:ro
      - rabbitmq_data:/var/lib/rabbitmq
      - ./infrastructure/rabbitmq/20-domain.conf:/etc/rabbitmq/conf.d/20-domain.conf:ro
      - ./infrastructure/rabbitmq/domain-definitions.json:/etc/rabbitmq/domain-definitions.json:ro
    healthcheck:
      test: ["CMD-SHELL", "openssl s_client -connect localhost:5671 -servername rabbitmq -CAfile /tls/ca.crt -verify_hostname rabbitmq -verify_return_error -brief < /dev/null > /dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: on-failure

  order-service:
    depends_on:
      consul:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    build:
      context: .
      dockerfile: services/order/Dockerfile
    ports:
        - "13001:8000"
    volumes:
        - ./infrastructure/tls/generated:/tls:ro
        - "./services/order/data:/volume"
    environment:
        <<: *tls-environment
        CONSUL_URL: https://consul:8501
        PYTHONUNBUFFERED: 1
        SQLALCHEMY_DATABASE_URL: sqlite+aiosqlite:////volume/orders.db
        MONGODB_URL: mongodb://mongodb:27017/?tls=true&tlsCAFile=/tls/ca.crt
        AUDIT_DATABASE: manufacturing_audit
        RABBITMQ_URL: amqps://manufacturing:manufacturing@rabbitmq:5671/?cafile=/tls/ca.crt
        RABBITMQ_EXCHANGE: manufacturing.events
    restart: on-failure

  delivery:
    user: "0:0"
    depends_on:
      consul:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    build:
      context: .
      dockerfile: services/delivery/Dockerfile
    ports:
      - '13004:8000'
    volumes:
      - ./infrastructure/tls/generated:/tls:ro
      - './services/delivery/data:/volume'
    environment:
      <<: *tls-environment
      CONSUL_URL: https://consul:8501
      PYTHONUNBUFFERED: 1
      SQLALCHEMY_DATABASE_URL: ${DELIVERY_DATABASE_URL}
      RABBITMQ_URL: amqps://manufacturing:manufacturing@rabbitmq:5671/?cafile=/tls/ca.crt
      RABBITMQ_EXCHANGE: manufacturing.events
    restart: on-failure

  machineservice:
    depends_on:
      consul:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    build:
      context: .
      dockerfile: services/machine/Dockerfile
    ports:
      - '13002:8000'
    volumes:
      - ./infrastructure/tls/generated:/tls:ro
      - './services/machine/data:/volume'
    environment:
      <<: *tls-environment
      CONSUL_URL: https://consul:8501
      PYTHONUNBUFFERED: 1
      SQLALCHEMY_DATABASE_URL: sqlite+aiosqlite:////volume/machine.db
      RABBITMQ_URL: amqps://manufacturing:manufacturing@rabbitmq:5671/?cafile=/tls/ca.crt
      RABBITMQ_EXCHANGE: manufacturing.events
    restart: on-failure

  client_service:
    depends_on:
      consul:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    build:
      context: .
      dockerfile: services/client/Dockerfile
    container_name: client_service
    ports:
      - '13005:8000'
    volumes:
      - ./infrastructure/tls/generated:/tls:ro
      - './services/client/data:/volume'
    environment:
      <<: *tls-environment
      CONSUL_URL: https://consul:8501
      PYTHONUNBUFFERED: 1
      SQLALCHEMY_DATABASE_URL: sqlite+aiosqlite:////volume/client.db
      RABBITMQ_URL: amqps://manufacturing:manufacturing@rabbitmq:5671/?cafile=/tls/ca.crt
      RABBITMQ_EXCHANGE: manufacturing.events
    restart: on-failure


  paymentservice:
    user: "0:0"
    depends_on:
      consul:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    build:
      context: .
      dockerfile: services/payment/Dockerfile
    ports:
      - '13006:8000'
    volumes:
      - ./infrastructure/tls/generated:/tls:ro
      - './services/payment/data:/volume'
    environment:
      <<: *tls-environment
      CONSUL_URL: https://consul:8501
      PYTHONUNBUFFERED: 1
      SQLALCHEMY_DATABASE_URL: sqlite+aiosqlite:////volume/payment.db
      RABBITMQ_URL: amqps://manufacturing:manufacturing@rabbitmq:5671/?cafile=/tls/ca.crt
      RABBITMQ_EXCHANGE: manufacturing.events
    restart: on-failure

  mongodb:
    image: mongo:8.0
    command: ["mongod", "--bind_ip_all", "--tlsMode", "requireTLS", "--tlsCertificateKeyFile", "/tls/server.pem", "--tlsCAFile", "/tls/ca.crt", "--tlsAllowConnectionsWithoutCertificates"]
    volumes:
      - ./infrastructure/tls/generated:/tls:ro
      - audit_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--tls", "--tlsCAFile", "/tls/ca.crt", "--quiet", "--eval", "db.adminCommand({ping:1})"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: on-failure

  event-logger:
    build:
      context: .
      dockerfile: services/event_logger/Dockerfile
    depends_on:
      consul:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    volumes:
      - ./infrastructure/tls/generated:/tls:ro
    environment:
      <<: *tls-environment
      CONSUL_URL: https://consul:8501
      PYTHONUNBUFFERED: 1
      MONGODB_URL: mongodb://mongodb:27017/?tls=true&tlsCAFile=/tls/ca.crt
      AUDIT_DATABASE: manufacturing_audit
      RABBITMQ_URL: amqps://manufacturing:manufacturing@rabbitmq:5671/?cafile=/tls/ca.crt
      RABBITMQ_EXCHANGE: manufacturing.events
    restart: on-failure

  log-aggregator:
    build:
      context: .
      dockerfile: services/log_aggregator/Dockerfile
    depends_on:
      consul:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    ports:
      - '127.0.0.1:13007:8000'
    volumes:
      - ./infrastructure/tls/generated:/tls:ro
    environment:
      <<: *tls-environment
      CONSUL_URL: https://consul:8501
      MONGODB_URL: mongodb://mongodb:27017/?tls=true&tlsCAFile=/tls/ca.crt
      LOG_DATABASE: manufacturing_audit
      RABBITMQ_URL: amqps://manufacturing:manufacturing@rabbitmq:5671/?cafile=/tls/ca.crt
    restart: on-failure

  haproxy:
    build:
      context: .
      dockerfile: haproxy/Dockerfile
    ports:
      - "8080:8080"
      - "8443:8443"
      - "8404:8404"
    volumes:
      - ./infrastructure/tls/generated:/tls:ro
    environment:
      HAPROXY_PORT: 8080
      HAPROXY_STATS_PORT: 8404
    depends_on:
      - consul
      - order-service
      - delivery
      - client_service
      - paymentservice
      - machineservice
      - event-logger
      - log-aggregator
    restart: on-failure

volumes:
  rabbitmq_data:
  audit_data:
