services:
  client_service:
    build: ./fastapi_app/client
    container_name: client_service
    ports:
      - '13001:8000'
    volumes:
      - './db_volume:/volume'
    environment:
      - PYTHONUNBUFFERED=1
      - SQLALCHEMY_DATABASE_URL=sqlite+aiosqlite:////volume/client.db
    restart: on-failure