global
  log stdout format raw local0
  maxconn 2000

defaults
  log global
  mode http
  option httplog
  option forwardfor
  retries 3
  timeout connect 5s
  timeout client 50s
  timeout server 50s
  default-server inter 2s fall 3 rise 2 resolvers docker init-addr libc,none

resolvers docker
  nameserver dns 127.0.0.11:53
  resolve_retries 3
  timeout resolve 1s
  timeout retry 1s
  hold valid 10s

frontend api_gateway
  bind *:${HAPROXY_PORT}

  # Gateway liveness; backend availability is checked separately.
  http-request return status 200 content-type application/json string '{"status":"OK","service":"api-gateway"}' if { path /health }

  # Normalize trailing slashes so FastAPI does not redirect to an internal path.
  http-request replace-path ^(.*)/$ \1 if { path_beg /api/ }

  acl PATH_orders path_reg ^/api/orders(/|$)
  acl PATH_pieces path_reg ^/api/pieces(/|$)
  acl PATH_clients path_reg ^/api/clients(/|$)
  acl PATH_payments path_reg ^/api/payments(/|$)
  acl PATH_machine path_reg ^/api/machine(/|$)
  acl PATH_deliveries path_reg ^/api/deliveries(/|$)

  # Keep existing Bruno URLs working.
  acl PATH_order_legacy path_reg ^/api/order(/|$)
  acl PATH_delivery_legacy path_reg ^/api/delivery(/|$)

  http-request return status 404 content-type application/json string '{"detail":"Gateway route not found"}' unless PATH_orders or PATH_pieces or PATH_clients or PATH_payments or PATH_machine or PATH_deliveries or PATH_order_legacy or PATH_delivery_legacy

  use_backend be_order if PATH_orders or PATH_pieces or PATH_order_legacy
  use_backend be_client if PATH_clients
  use_backend be_payment if PATH_payments
  use_backend be_machine if PATH_machine
  use_backend be_delivery if PATH_deliveries or PATH_delivery_legacy

backend be_order
  http-request replace-path ^/api/orders(.*)$ /order\1 if { path_reg ^/api/orders(/|$) }
  http-request replace-path ^/api/pieces(.*)$ /piece\1 if { path_reg ^/api/pieces(/|$) }
  http-request replace-path ^/api/order/?(.*)$ /\1 if { path_reg ^/api/order(/|$) }
  server order order-service:8000 check

backend be_client
  http-request replace-path ^/api/clients(.*)$ /clients\1
  server client client_service:8000 check

backend be_payment
  http-request replace-path ^/api/payments(.*)$ /payment\1
  server payment paymentservice:8000 check

backend be_machine
  http-request replace-path ^/api(/machine.*)$ \1
  server machine machineservice:8000 check

backend be_delivery
  http-request replace-path ^/api/deliveries(.*)$ /deliveries/delivery\1 if { path_reg ^/api/deliveries(/|$) }
  http-request replace-path ^/api/delivery/?(.*)$ /deliveries/\1 if { path_reg ^/api/delivery(/|$) }
  server delivery delivery:8000 check

listen stats
  bind :${HAPROXY_STATS_PORT}
  stats enable
  stats uri /
  stats hide-version
  stats auth admin:admin
  stats refresh 2s
